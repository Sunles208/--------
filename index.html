<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Caspian Transit</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #334155;
            padding-bottom: 15px;
        }
        h1 { margin: 0; font-size: 24px; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #334155;
        }
        .stat-title { font-size: 14px; color: var(--text-muted); margin-bottom: 10px; }
        .stat-value { font-size: 28px; font-weight: bold; color: var(--primary); }
        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }
        .cargo-list {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #334155;
        }
        .cargo-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            background: #334155;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
        }
        .cargo-btn:hover { background: #475569; }
        .cargo-btn.active { background: var(--primary); }
        .details-panel {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #334155;
        }
        .details-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-transit { background: #854d0e; color: #fef08a; }
        .badge-customs { background: #166534; color: #bbf7d0; }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #334155;
        }
        .info-label { color: var(--text-muted); }
        .info-value { font-weight: bold; }
        .risk-high { color: var(--danger); }
        .risk-low { color: var(--success); }
        .btn-action {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
        }
        .btn-action:hover { background: #1d4ed8; }
        .btn-action:disabled { background: #475569; cursor: not-allowed; }
        #message { margin-top: 15px; font-size: 14px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌊 Smart Caspian Transit</h1>
            <div>Цифровой двойник мультимодального хаба</div>
        </header>

        <!-- Блок статистики -->
        <div class="stats-grid" id="dashboard-stats">
            <div class="stat-card">
                <div class="stat-title">Активных грузов</div>
                <div class="stat-value" id="stat-cargo">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Общий углеродный след (ESG)</div>
                <div class="stat-value" id="stat-esg">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Статус системы</div>
                <div class="stat-value" id="stat-status">-</div>
            </div>
        </div>

        <!-- Основная часть -->
        <div class="main-content">
            <div class="cargo-list">
                <h3 style="margin-top: 0;">Выберите груз</h3>
                <button class="cargo-btn" onclick="loadCargo('CASP-001')">
                    📦 Контейнер с зерном<br><small style="color:#94a3b8">Астрахань -> Энзели</small>
                </button>
                <button class="cargo-btn" onclick="loadCargo('CASP-002')">
                    ⚙️ Промышленное оборудование<br><small style="color:#94a3b8">Махачкала -> Амирабад</small>
                </button>
            </div>

            <div class="details-panel" id="details-panel" style="display: none;">
                <div class="details-header">
                    <h2 style="margin: 0;" id="cargo-name">Название</h2>
                    <span class="badge" id="cargo-status">Статус</span>
                </div>
                
                <div class="info-row">
                    <span class="info-label">Маршрут</span>
                    <span class="info-value" id="cargo-route">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Текущее местоположение</span>
                    <span class="info-value" id="cargo-location">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Углеродный след (ESG)</span>
                    <span class="info-value" id="cargo-esg">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Риск задержки (ML-прогноз)</span>
                    <span class="info-value" id="cargo-risk">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Причина риска</span>
                    <span class="info-value" id="cargo-reason" style="color: #fca5a5;">-</span>
                </div>

                <div id="alternative-route" style="display: none; background: rgba(37, 99, 235, 0.1); padding: 15px; border-radius: 8px; margin-top: 20px; border: 1px solid var(--primary);">
                    <strong style="color: var(--primary);">💡 Рекомендация системы:</strong>
                    <p id="alternative-text" style="margin: 5px 0 0 0; font-size: 14px;"></p>
                </div>

                <button class="btn-action" id="btn-customs" onclick="clearCustoms()">
                    🛃 Пройти таможню (Pre-clearance)
                </button>
                <div id="message"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:8000';
        let currentCargoId = null;

        // Загрузка статистики
        async function loadDashboard() {
            try {
                const res = await fetch(`${API_URL}/api/dashboard`);
                const data = await res.json();
                document.getElementById('stat-cargo').innerText = data.total_active_cargo;
                document.getElementById('stat-esg').innerText = data.total_carbon_footprint_tons + ' т';
                document.getElementById('stat-status').innerText = 'Онлайн 🟢';
            } catch (e) {
                console.error("Ошибка загрузки дашборда", e);
            }
        }

        // Загрузка карточки груза
        async function loadCargo(id) {
            currentCargoId = id;
            document.querySelectorAll('.cargo-btn').forEach(btn => btn.classList.remove('active'));
            event.target.closest('.cargo-btn').classList.add('active');

            try {
                const res = await fetch(`${API_URL}/api/cargo/${id}`);
                const data = await res.json();
                
                document.getElementById('details-panel').style.display = 'block';
                document.getElementById('cargo-name').innerText = data.name;
                document.getElementById('cargo-route').innerText = data.route;
                document.getElementById('cargo-location').innerText = data.current_location;
                document.getElementById('cargo-esg').innerText = data.carbon_footprint_tons + ' т CO2';
                
                const riskPercent = Math.round(data.delay_probability * 100);
                const riskEl = document.getElementById('cargo-risk');
                riskEl.innerText = riskPercent + '%';
                riskEl.className = 'info-value ' + (riskPercent > 65 ? 'risk-high' : 'risk-low');
                
                document.getElementById('cargo-reason').innerText = data.delay_reason;

                // Статус
                const statusEl = document.getElementById('cargo-status');
                statusEl.innerText = data.status;
                if (data.status.includes('Cleared')) {
                    statusEl.className = 'badge badge-customs';
                    document.getElementById('btn-customs').disabled = true;
                    document.getElementById('btn-customs').innerText = '✅ Таможня пройдена';
                } else {
                    statusEl.className = 'badge badge-transit';
                    document.getElementById('btn-customs').disabled = false;
                    document.getElementById('btn-customs').innerText = '🛃 Пройти таможню (Pre-clearance)';
                }

                // Альтернативный маршрут
                const altBlock = document.getElementById('alternative-route');
                if (data.alternative_route) {
                    altBlock.style.display = 'block';
                    document.getElementById('alternative-text').innerText = 
                        `${data.alternative_route.suggestion}. Экономия: ${data.alternative_route.estimated_saving_days} дн. ESG: ${data.alternative_route.esg_impact}`;
                } else {
                    altBlock.style.display = 'none';
                }

                document.getElementById('message').innerText = '';
            } catch (e) {
                alert("Ошибка загрузки груза. Убедись, что бэкенд запущен!");
            }
        }

        // Отправка на таможню (Смарт-контракт)
        async function clearCustoms() {
            if (!currentCargoId) return;
            
            const btn = document.getElementById('btn-customs');
            const msg = document.getElementById('message');
            btn.disabled = true;
            msg.style.color = 'var(--text-muted)';
            msg.innerText = 'Отправка данных в распределенный реестр...';

            try {
                const res = await fetch(`${API_URL}/api/customs/clear`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': 'secret-token-2026' // Наш защищенный ключ
                    },
                    body: JSON.stringify({ cargo_id: currentCargoId })
                });
                
                const data = await res.json();
                if (res.ok) {
                    msg.style.color = 'var(--success)';
                    msg.innerText = '✅ ' + data.message + ' TX: ' + data.blockchain_tx;
                    loadCargo(currentCargoId); // Обновляем карточку
                } else {
                    msg.style.color = 'var(--danger)';
                    msg.innerText = '❌ Ошибка: ' + data.detail;
                    btn.disabled = false;
                }
            } catch (e) {
                msg.style.color = 'var(--danger)';
                msg.innerText = '❌ Ошибка сети. Проверь бэкенд.';
                btn.disabled = false;
            }
        }

        // Инициализация при загрузке страницы
        loadDashboard();
    </script>
</body>
</html>
